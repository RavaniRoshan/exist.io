<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="nodePulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style><![CDATA[
      /* Base typography & theme adaptation */
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 58px;
        letter-spacing: -1.5px;
        fill: url(#textGrad);
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        fill: #94A3B8;
      }
      .tag-bg {
        fill: #1E293B;
        stroke: #334155;
        stroke-width: 1;
      }

      /* Animations */
      @keyframes dashMove {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes pulseRing {
        0% { r: 10px; opacity: 0.9; stroke-width: 2.5; }
        50% { r: 18px; opacity: 0.4; stroke-width: 1.5; }
        100% { r: 10px; opacity: 0.9; stroke-width: 2.5; }
      }

      @keyframes beaconWave {
        0% { r: 6px; opacity: 0.8; }
        100% { r: 26px; opacity: 0; }
      }

      @keyframes nodeBreathe {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.08); opacity: 1; }
      }

      @keyframes agentPulse {
        0%, 100% { fill: #2DD4BF; filter: drop-shadow(0 0 2px #2DD4BF); }
        50% { fill: #60A5FA; filter: drop-shadow(0 0 8px #60A5FA); }
      }

      .flow-path {
        stroke-dasharray: 6 4;
        animation: dashMove 2.4s linear infinite;
      }
      .pulse-ring-1 {
        animation: pulseRing 3s ease-in-out infinite;
        transform-origin: 155px 70px;
      }
      .pulse-ring-2 {
        animation: pulseRing 3s ease-in-out infinite 1.5s;
        transform-origin: 155px 130px;
      }
      .wave-1 {
        animation: beaconWave 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: 155px 70px;
      }
      .wave-2 {
        animation: beaconWave 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.1s;
        transform-origin: 155px 130px;
      }
      .agent-core {
        animation: agentPulse 4s ease-in-out infinite;
      }
      .branch-node {
        transform-origin: center;
        animation: nodeBreathe 4s ease-in-out infinite;
      }

      /* Light mode overrides */
      @media (prefers-color-scheme: light) {
        .badge-text { fill: #475569; }
        .tag-bg { fill: #F1F5F9; stroke: #CBD5E1; }
        .node-track { stroke: #CBD5E1; }
      }
    ]]></style>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="115" cy="100" r="85" fill="#10B981" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="210" cy="100" r="70" fill="#3B82F6" opacity="0.10" filter="url(#softGlow)" />

  <!-- Git Forge Network Diagram Mark (Left: x: 30 to 190) -->
  <g id="git-graph" transform="translate(15, 0)">
    <!-- Base track lines -->
    <path class="node-track" d="M 50 100 L 95 100" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <path class="node-track" d="M 95 100 C 120 100, 130 70, 155 70" stroke="#334155" stroke-width="3" fill="none" />
    <path class="node-track" d="M 95 100 C 120 100, 130 130, 155 130" stroke="#334155" stroke-width="3" fill="none" />
    <path class="node-track" d="M 155 70 C 180 70, 190 100, 215 100" stroke="#334155" stroke-width="3" fill="none" />
    <path class="node-track" d="M 155 130 C 180 130, 190 100, 215 100" stroke="#334155" stroke-width="3" fill="none" />

    <!-- Animated Data Flow Paths (Representing Agent & Human commits merging) -->
    <path class="flow-path" d="M 50 100 L 95 100" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" />
    <path class="flow-path" d="M 95 100 C 120 100, 130 70, 155 70" stroke="#2DD4BF" stroke-width="3" fill="none" />
    <path class="flow-path" d="M 95 100 C 120 100, 130 130, 155 130" stroke="#3B82F6" stroke-width="3" fill="none" />
    <path class="flow-path" d="M 155 70 C 180 70, 190 100, 215 100" stroke="#2DD4BF" stroke-width="3" fill="none" />
    <path class="flow-path" d="M 155 130 C 180 130, 190 100, 215 100" stroke="#60A5FA" stroke-width="3" fill="none" />

    <!-- Beacon Wave Rings for Activity -->
    <circle class="wave-1" cx="155" cy="70" r="10" stroke="#2DD4BF" stroke-width="1.5" fill="none" />
    <circle class="wave-2" cx="155" cy="130" r="10" stroke="#60A5FA" stroke-width="1.5" fill="none" />

    <!-- Root Node (Repo Origin) -->
    <circle cx="50" cy="100" r="9" fill="#0F172A" stroke="#10B981" stroke-width="3.5" filter="url(#glow)" />
    <circle cx="50" cy="100" r="4" fill="#34D399" />

    <!-- Branch Split Node -->
    <circle cx="95" cy="100" r="7" fill="#0F172A" stroke="#2DD4BF" stroke-width="3" />
    <circle cx="95" cy="100" r="3" fill="#A7F3D0" />

    <!-- Top Branch Node (Human / Feature Branch) -->
    <g class="branch-node">
      <circle class="pulse-ring-1" cx="155" cy="70" r="12" stroke="#2DD4BF" fill="none" />
      <circle cx="155" cy="70" r="9" fill="#0F172A" stroke="#2DD4BF" stroke-width="3.5" />
      <circle cx="155" cy="70" r="4" fill="#2DD4BF" />
    </g>

    <!-- Bottom Branch Node (AI Agent / MCP Branch) -->
    <g class="branch-node">
      <circle class="pulse-ring-2" cx="155" cy="130" r="12" stroke="#3B82F6" fill="none" />
      <circle cx="155" cy="130" r="9" fill="#0F172A" stroke="#3B82F6" stroke-width="3.5" />
      <!-- Star / Spark glyph inside Agent Node -->
      <polygon points="155,126 156.5,129 160,130 156.5,131 155,134 153.5,131 150,130 153.5,129" fill="#93C5FD" />
    </g>

    <!-- Convergence / Target Node (Merged Main) -->
    <circle cx="215" cy="100" r="11" fill="#0F172A" stroke="url(#brandGrad)" stroke-width="4" filter="url(#glow)" />
    <circle class="agent-core" cx="215" cy="100" r="5" />
  </g>

  <!-- Typography & Brand Text (Right: x: 265 to 780) -->
  <g transform="translate(260, 0)">
    <!-- Main Logotype -->
    <text x="0" y="105" class="title-text">exist<tspan fill="#10B981">.</tspan>io</text>

    <!-- Tag Pill -->
    <g transform="translate(235, 62)">
      <rect x="0" y="0" width="138" height="24" rx="12" class="tag-bg" />
      <circle cx="14" cy="12" r="4" fill="#10B981" />
      <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">OPEN FORGE</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="2" y="142" class="badge-text">A Git Forge for People &amp; Coding Agents</text>
  </g>
</svg>
