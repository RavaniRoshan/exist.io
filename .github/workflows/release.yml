name: Release
 
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.5.0-beta)'
        required: true
        default: 'v0.5.0-beta'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify VERSION matches the tag
        if: github.event_name == 'push'
        run: test "$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF#refs/tags/}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install packaging utilities
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Determine release version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package release archives
        run: ./scripts/build-release.sh "${{ steps.vars.outputs.version }}"

      - name: Extract release notes from CHANGELOG
        run: |
          version="${{ steps.vars.outputs.version }}"
          awk -v version="${version#v}" '
            $0 ~ "^## \\[" version "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: exist.io ${{ steps.vars.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.version, '-beta') || contains(steps.vars.outputs.version, '-rc') }}
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install:
    name: Install (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install, bootstrap, and health-check
        env:
          EXIST_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/install.sh
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

          DATA_DIR="$RUNNER_TEMP/exist-data"
          existd bootstrap --email admin@corp.exist.io --namespace acme --data-dir "$DATA_DIR"

          EXIST_DATA_DIR="$DATA_DIR" EXIST_LISTEN_ADDR="127.0.0.1:18080" EXIST_SSH_ADDR="none" existd > daemon.log 2>&1 &
          DAEMON_PID=$!

          START=$(date +%s)
          READY=false
          for _ in $(seq 1 120); do
            if curl -sf http://127.0.0.1:18080/healthz >/dev/null; then READY=true; break; fi
            sleep 0.5
          done
          END=$(date +%s)

          echo "time-to-ready (${{ matrix.platform }}): $((END - START))s" >> "$GITHUB_STEP_SUMMARY"
          curl -sf http://127.0.0.1:18080/healthz

          kill "$DAEMON_PID" 2>/dev/null || true
          wait "$DAEMON_PID" 2>/dev/null || true
          [ "$READY" = true ]
