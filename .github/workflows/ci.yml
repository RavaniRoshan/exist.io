name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Go Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install static analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Verify zero-CGO compilation
        env:
          CGO_ENABLED: 0
        run: |
          go build -v ./cmd/exist ./cmd/existd

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: staticcheck ./... || true

      - name: Run govulncheck
        run: govulncheck ./... || true

      - name: Run gosec security scanner
        run: gosec -exclude=G101,G104 ./... || true

      - name: Run tests with race detector
        run: go test -v -race ./...

  frontend:
    name: Frontend Web Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest automated test suite
        run: npm test

      - name: Build production bundle
        run: npm run build

  docs:
    name: Documentation Validation & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation links
        run: npm run validate

      - name: Build documentation site
        run: npm run build
